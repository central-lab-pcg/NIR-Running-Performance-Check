<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIR Interface Report Tool</title>
<script>var NIR_TOOL_ID = "report";</script>
<script src="https://central-lab-pcg.github.io/NIR-Running-Performance-Check/nir_sidebar.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --border:#d7dae0; --text:#1c2230; --muted:#6b7280;
  --accent:#2563eb; --accent-dark:#1d4ed8; --shade:#eceff3; --diffshade:#e4e7ec;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c; --panel:#1d2027; --border:#333844; --text:#e7e9ee; --muted:#9aa1ad;
    --accent:#5b8def; --accent-dark:#4a75cc; --shade:#262a33; --diffshade:#2c313b;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c; --panel:#1d2027; --border:#333844; --text:#e7e9ee; --muted:#9aa1ad;
  --accent:#5b8def; --accent-dark:#4a75cc; --shade:#262a33; --diffshade:#2c313b;
}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Sarabun","Segoe UI",Tahoma,Arial,sans-serif;
  font-size:14px;
}
.wrap{max-width:1400px; margin:0 auto; padding:20px 16px 60px;}
h1{font-size:19px; margin:4px 0 2px;}
.sub{color:var(--muted); font-size:13px; margin-bottom:16px;}
.panel{
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:16px; margin-bottom:18px;
}
.panel h2{font-size:15px; margin:0 0 10px;}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;}
.field{display:flex; flex-direction:column; gap:4px;}
.field label{font-size:12px; color:var(--muted);}
input[type=date], input[type=text], select{
  border:1px solid var(--border); border-radius:8px; padding:8px 10px;
  background:var(--bg); color:var(--text); font-family:inherit; font-size:13px;
}
textarea{
  width:100%; min-height:110px; border:1px solid var(--border); border-radius:8px;
  padding:10px; background:var(--bg); color:var(--text); font-family:monospace; font-size:12px;
  resize:vertical;
}
button{
  font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text);
  padding:9px 16px;
}
button.primary{background:var(--accent); border-color:var(--accent-dark); color:#fff;}
button.primary:hover{background:var(--accent-dark);}
button:disabled{opacity:.5; cursor:not-allowed;}
button:hover:not(:disabled){filter:brightness(1.05);}
.filebtn{position:relative; overflow:hidden;}
.filebtn input[type=file]{
  position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;
}
.hint{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5;}
.status{font-size:12.5px; margin-top:8px; padding:8px 10px; border-radius:8px; display:none;}
.status.ok{display:block; background:#16803317; color:#16803350; border:1px solid #16803340;}
:root[data-theme="dark"] .status.ok, @media (prefers-color-scheme:dark){.status.ok{color:#7fd99c;}}
.status.err{display:block; background:#dc262617; color:#b91c1c; border:1px solid #dc262640;}

/* ---- report ---- */
#reportHolder{overflow-x:auto;}
.report{
  background:#fff; color:#111; width:1550px; max-width:none; margin:0 auto;
  padding:18px 22px 26px; font-family:"Sarabun","Segoe UI",Tahoma,Arial,sans-serif;
  border:1px solid #ccc;
}
.rpt-top{position:relative; min-height:64px; font-size:13px;}
.rpt-top .center{font-weight:700; font-size:14px; text-align:center; position:absolute; left:50%; top:0; transform:translateX(-50%); white-space:nowrap;}
.rpt-top .right{text-align:right; line-height:1.6; position:absolute; top:0; right:0; outline:none;}
.rpt-title{text-align:center; font-weight:700; font-size:15px; margin:6px 0 2px;}
.rpt-meta{display:flex; justify-content:space-between; font-size:12.5px; margin:4px 0 8px;}
.rpt-meta input[type=text]{border:none; border-bottom:1px dotted #888; background:transparent; font-family:inherit; font-size:12.5px; width:160px;}
table.rt{border-collapse:collapse; width:100%; font-size:11.5px;}
table.rt th, table.rt td{border:1px solid #333; padding:3px 4px; text-align:center; vertical-align:middle;}
table.rt thead th{background:#eef0f3; font-weight:600;}
table.rt td.left{text-align:left;}
table.rt td[contenteditable="true"]{outline:none;}
table.rt td[contenteditable="true"]:focus{background:#fff7d6;}
tr.avgrow td{background:var(--shade,#eceff3); font-weight:600;}
tr.diffrow td{background:var(--diffshade,#e4e7ec); font-style:italic;}
tr.qcrow td{background:#f7f2e0;}
.rpt-notes{font-size:11px; margin-top:10px; line-height:1.7;}
.rpt-notes input[type=text]{border:none; border-bottom:1px dotted #888; background:transparent; font-family:inherit; font-size:11px;}
.rpt-sign{display:flex; justify-content:space-around; margin-top:34px; font-size:12px; text-align:center;}
.rpt-sign .col{width:30%;}
.rpt-sign .line{border-bottom:1px dotted #333; height:34px; margin-bottom:4px;}
.sigpad-wrap{display:flex; flex-direction:column; gap:4px;}
canvas.sigpad{border:1px dashed var(--border); border-radius:6px; background:#fff; touch-action:none; cursor:crosshair;}
button.sigclear{padding:4px 8px; font-size:11px; align-self:flex-start;}
button.addname{padding:0; width:36px; height:36px; font-size:16px; line-height:1; flex:none;}
.rpt-sign .sigline{height:40px; margin-bottom:4px; display:flex; align-items:flex-end; justify-content:center;}
.rpt-sign .sigline.empty{border-bottom:1px dotted #333;}
.rpt-sign .sigline img{max-height:38px; max-width:170px;}
.rowbtns{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
table.rt td.namecell{min-width:70px;}
select.diffmode-sel{font-size:11px; padding:2px 3px; border:1px solid #999; border-radius:4px; background:#fff; color:#111; font-family:inherit;}
.rpt-notes[contenteditable="true"]:focus, .rpt-top .right[contenteditable="true"]:focus{background:#fff7d6; outline:none;}

@media print{
  body *{visibility:hidden;}
  #reportHolder, #reportHolder *{visibility:visible;}
  #reportHolder{position:absolute; left:0; top:0; width:100%; overflow:visible;}
  .report{border:none; width:100%; padding:0;}
  @page{size:A4 landscape; margin:8mm;}
}
</style>
</head>
<body>
<div class="wrap" id="app">

  <h1>NIR Interface Report Tool</h1>

  <div class="panel">
    <h2>1) นำเข้าข้อมูล</h2>
    <div class="row">
      <button class="filebtn">📂 เลือกค่าวิเคราะห์ไฟล์.xlsx
        <input type="file" id="fileInput" accept=".xlsx,.xls">
      </button>
      <div class="field">
        <label>Test Date</label>
        <input type="date" id="testDate">
      </div>
      <div class="field">
        <label>ผู้ทดสอบ</label>
        <div style="display:flex; gap:6px;">
          <select id="nameTester">
            <option value="">-- เลือก --</option>
            <option>กวิณ แก้วประสงค์</option>
            <option>มินตรา วรนารถ</option>
          </select>
          <button type="button" class="addname" data-target="nameTester" title="เพิ่มชื่อใหม่">+</button>
        </div>
      </div>
      <div class="field">
        <label>ผู้ทวนสอบ</label>
        <div style="display:flex; gap:6px;">
          <select id="nameReviewer">
            <option value="">-- เลือก --</option>
            <option>กุลธิดา เทพรักษ์</option>
            <option>กวิณ แก้วประสงค์</option>
          </select>
          <button type="button" class="addname" data-target="nameReviewer" title="เพิ่มชื่อใหม่">+</button>
        </div>
      </div>
      <div class="field">
        <label>ผู้บันทึกผล</label>
        <div style="display:flex; gap:6px;">
          <select id="nameApprover">
            <option value="">-- เลือก --</option>
            <option>พรพรรณ ดวงจันทอง</option>
            <option>พิสิษฐ์ ชู้กระโทก</option>
          </select>
          <button type="button" class="addname" data-target="nameApprover" title="เพิ่มชื่อใหม่">+</button>
        </div>
      </div>
      <button class="primary" id="processBtn" disabled>สร้างรายงาน</button>
    </div>
    <details style="margin-top:14px;" open>
      <summary style="cursor:pointer; font-size:12.5px; color:var(--muted);">✍️ ลายเซ็น (วาดด้วยเมาส์/นิ้ว แล้วจะแทรกลงในรายงานให้อัตโนมัติ — ไม่บังคับ)</summary>
      <div class="row" style="margin-top:8px;">
        <div class="sigpad-wrap">
          <label style="font-size:12px; color:var(--muted);">ลายเซ็นผู้ทดสอบ</label>
          <canvas id="sigTester" class="sigpad" width="220" height="70"></canvas>
          <button type="button" class="sigclear" data-target="sigTester">ล้างลายเซ็น</button>
        </div>
        <div class="sigpad-wrap">
          <label style="font-size:12px; color:var(--muted);">ลายเซ็นผู้ทวนสอบ</label>
          <canvas id="sigReviewer" class="sigpad" width="220" height="70"></canvas>
          <button type="button" class="sigclear" data-target="sigReviewer">ล้างลายเซ็น</button>
        </div>
        <div class="sigpad-wrap">
          <label style="font-size:12px; color:var(--muted);">ลายเซ็นผู้บันทึกผล</label>
          <canvas id="sigApprover" class="sigpad" width="220" height="70"></canvas>
          <button type="button" class="sigclear" data-target="sigApprover">ล้างลายเซ็น</button>
        </div>
      </div>
    </details>
    <details style="margin-top:10px;">
      <summary style="cursor:pointer; font-size:12.5px; color:var(--muted);">หรือวางข้อมูลแบบคัดลอก-วาง (คัดลอกจากชีท Samples รวมหัวตาราง แล้ววางที่นี่แทนการอัปโหลดไฟล์)</summary>
      <textarea id="pasteArea" placeholder="วางข้อมูล (tab-separated) ที่นี่ รวมแถวหัวตารางด้วย"></textarea>
      <div class="rowbtns"><button id="pasteBtn">ใช้ข้อมูลที่วาง</button></div>
    </details>
    <div id="status" class="status"></div>
  </div>

  <div class="panel" id="reportPanel" style="display:none;">
    <h2>2) รายงาน (แก้ไขค่าในตารางได้โดยตรงก่อนบันทึก)</h2>
    <div class="rowbtns">
      <button class="primary" id="printBtn">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
      <button id="exportXlsxBtn">📊 บันทึกเป็น Excel (Interface)</button>
      <button id="addRowBtn">+ เพิ่มแถวว่าง</button>
    </div>
    <div id="reportHolder"></div>
  </div>

</div>

    const t = e.touches && e.touches[0];
    const cx = (t ? t.clientX : e.clientX) - rect.left;
    const cy = (t ? t.clientY : e.clientY) - rect.top;
    return { x: cx * (canvas.width / rect.width), y: cy * (canvas.height / rect.height) };
  }
  function start(e){ e.preventDefault(); drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function move(e){ if(!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); hasInk = true; }
  function end(){ if(!drawing) return; drawing = false; onSignatureChanged(); }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  canvas._hasInk = () => hasInk;
  canvas._clear = () => { ctx.clearRect(0,0,canvas.width,canvas.height); hasInk = false; };
}

// ---------- parsing ----------
function rowsFromAOA(aoa){
  if(!aoa || aoa.length<2) throw new Error('ไม่พบข้อมูล หรือไม่มีแถวหัวตาราง');
  const headers = aoa[0].map(h=>(h===undefined||h===null)?'':String(h).trim());
  const rows = [];
  for(let r=1;r<aoa.length;r++){
    const line = aoa[r];
    if(!line || line.every(c=>c===undefined||c===null||String(c).trim()==='')) continue;
    const obj = {};
    headers.forEach((h,i)=>{ obj[h] = line[i]; });
    rows.push(obj);
  }
  return rows;
}

function toNum(v){
  if(v===undefined||v===null) return null;
  const s = String(v).trim();
  if(s==='') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}

function buildGroups(rows){
  const order = [];
  const map = new Map();
  rows.forEach((row, idx)=>{
    const isQC = String(row[H_TYPE]||'').trim() === 'CheckSample';
    const labNo = String(isQC ? (row[H_NUM]||'') : (row[H_LABNO]||'')).trim();
    if(!labNo) return;
    const sampleName = String(row[H_NAME]||row[H_NUM]||'').trim();
    const values = {};
    PARAMS.forEach(p=>{ values[p.code] = toNum(row[p.header]); });
    if(!map.has(labNo)){
      map.set(labNo, {labNo, isQC, sampleName, rows:[], firstIdx: idx});
      order.push(labNo);
    }
    map.get(labNo).rows.push({sampleName, values});
  });
  return order.map(k=>map.get(k));
}

function sigFig3(n){
  if(n===0) return '0';
  const absN = Math.abs(n);
  const d = 3 - 1 - Math.floor(Math.log10(absN));
  if(d>0) return n.toFixed(d);
  return String(Math.round(n));
}
const QC_BLANK_CODES = ['Ca','P','NaCl','Aw'];
function formatValue(code, val, sampleName, isQC){
  if(isQC){
    if(QC_BLANK_CODES.includes(code)) return '-';
    if(val===null || val===undefined || !isFinite(val)) return '-';
    if(code==='ASH') return val.toFixed(1);
    return val.toFixed(2);
  }
  if(val===null || val===undefined || !isFinite(val)) return '-';
  const nm = (sampleName||'').trim().toUpperCase();
  if(code==='M' && nm==='YC') return val.toFixed(1);
  if(code==='ASH') return val.toFixed(1);
  if(code==='Aw') return val.toFixed(2);
  if(Math.abs(val) < 1) return val.toFixed(3);
  return sigFig3(val);
}

// diff-row calculation:
//  - 'diff' (%Repeatability Diff): |C1-C2| reported with the SAME number of decimal
//    places as the analyzed values shown in the table (uses formatValue's rule)
//  - 'rpd'  (%RPD): result to 2 decimals, number only (no % sign)
function decimalsOfFormatted(str){
  const m = String(str).match(/\.(\d+)/);
  return m ? m[1].length : 0;
}
function diffCellValue(code, a, b, isQC, mode, sampleName){
  if(isQC && QC_BLANK_CODES.includes(code)) return '-';
  if(a===null || b===null) return '-';
  if(mode==='rpd'){
    const denom = (a+b)/2;
    if(denom===0) return '-';
    const rpd = Math.abs(a-b)/Math.abs(denom)*100;
    return rpd.toFixed(2);
  }
  // decimals = the larger decimal count of the two analyzed values as displayed
  const da = decimalsOfFormatted(formatValue(code, a, sampleName, isQC));
  const db = decimalsOfFormatted(formatValue(code, b, sampleName, isQC));
  const d = Math.max(da, db);
  let out = (a-b).toFixed(d);
  if(Number(out)===0) out = (0).toFixed(d); // avoid "-0.00"
  return out;
}

// called from the in-table dropdown on a diff row to switch that row's mode
// without rebuilding the whole report (keeps other manual edits intact)
function onDiffModeChange(sel, gi){
  const g = groups[gi];
  if(!g || g.rows.length<2) return;
  g.diffMode = sel.value;
  const tr = sel.closest('tr');
  if(!tr) return;
  const r1 = g.rows[0], pair = g.rows[1];
  const cells = tr.querySelectorAll('td[contenteditable="true"]');
  PARAMS.forEach((p,i)=>{
    if(cells[i]) cells[i].textContent = diffCellValue(p.code, r1.values[p.code], pair.values[p.code], g.isQC, g.diffMode, g.sampleName);
  });
}

function esc(s){
  return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- process ----------
function processRows(rows){
  groups = buildGroups(rows);
  if(groups.length===0){ setStatus('ไม่พบแถวข้อมูลที่ใช้ได้ ตรวจสอบว่าคัดลอก/อัปโหลดไฟล์ที่มีหัวตารางตรงกับที่โปรแกรม NIR ส่งออก (เช่น "2Lab No/Job ID")', false); return; }
  setStatus(`ประมวลผลสำเร็จ: พบ ${groups.length} รายการ (Lab No.)`, true);
  renderReport();
}

document.getElementById('fileInput').addEventListener('change', function(e){
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheetName = wb.SheetNames.includes('Samples') ? 'Samples' : wb.SheetNames[0];
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, raw:true});
      const rows = rowsFromAOA(aoa);
      processRows(rows);
      document.getElementById('processBtn').disabled = false;
      window._lastRows = rows;
    }catch(err){
      setStatus('อ่านไฟล์ไม่สำเร็จ: '+err.message, false);
    }
  };
  reader.readAsArrayBuffer(f);
});

document.getElementById('printBtn').addEventListener('click', function(){
  const reportEl = document.getElementById('reportEl');
  if(!reportEl){ setStatus('ยังไม่มีรายงานให้พิมพ์ กรุณากด "สร้างรายงาน" ก่อน', false); return; }
  if(typeof html2canvas === 'undefined' || !window.jspdf){
    setStatus('โหลดไลบรารีสร้าง PDF ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่', false);
    return;
  }
  // read back any manual edits made directly in the on-page contenteditable cells
  const clone = reportEl.cloneNode(true);
  clone.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));

  // cloneNode() resets <select> to its original HTML `selected` attribute, so the PDF
  // always showed the first option. Replace each dropdown with plain text of the
  // option that is actually selected on screen.
  const liveSels = reportEl.querySelectorAll('select.diffmode-sel');
  clone.querySelectorAll('select.diffmode-sel').forEach((sel, i)=>{
    const live = liveSels[i];
    const opt = live && live.options[live.selectedIndex];
    const span = document.createElement('span');
    span.textContent = opt ? opt.textContent : sel.options[sel.selectedIndex].textContent;
    sel.replaceWith(span);
  });

  // render an offscreen copy styled like the print version so the captured
  // image matches the report exactly, then scale it to fit a single page
  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.left = '-10000px';
  wrapper.style.top = '0';
  wrapper.style.width = '1400px';
  wrapper.style.padding = '28px';
  wrapper.style.boxSizing = 'border-box';
  wrapper.style.background = '#fff';
  wrapper.style.color = '#111';
  wrapper.style.fontFamily = '"Sarabun","Segoe UI",Tahoma,Arial,sans-serif';
  const styleTag = document.createElement('style');
  styleTag.textContent = PRINT_CSS;
  wrapper.appendChild(styleTag);
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);

  setStatus('กำลังสร้างไฟล์ PDF...', true);
  html2canvas(wrapper, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(function(canvas){
    document.body.removeChild(wrapper);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 6; // mm, keep everything comfortably on one page
    let finalW = pageW - margin * 2;
    let finalH = canvas.height * finalW / canvas.width;
    if(finalH > pageH - margin * 2){
      finalH = pageH - margin * 2;
      finalW = canvas.width * finalH / canvas.height;
    }
    const x = (pageW - finalW) / 2;
    const y = (pageH - finalH) / 2;
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', x, y, finalW, finalH);
    const fname = 'NIR_Report_' + new Date().toISOString().slice(0,10) + '.pdf';
    // pdf.save() is blocked inside a published page, so hand the file to the
    // viewer through the same download path the Excel export uses
    const pdfBlob = new Blob([pdf.output('arraybuffer')], {type:'application/pdf'});
    return doDownload(fname, pdfBlob);
  }).catch(function(err){
    if(wrapper.parentNode) document.body.removeChild(wrapper);
    setStatus('เกิดข้อผิดพลาดในการสร้าง PDF: ' + err, false);
  });
});

  const tbody = document.querySelector('#reportEl table.rt tbody');
  if(!tbody) return;
  const tds = 3 + PARAMS.length + 1;
  const tr = document.createElement('tr');
  let html = `<td contenteditable="true">-</td><td contenteditable="true">-</td><td class="left" contenteditable="true">-</td>`;
  for(let i=0;i<PARAMS.length;i++) html += `<td contenteditable="true">-</td>`;
  html += `<td contenteditable="true"></td>`;
  tr.innerHTML = html;
  tbody.appendChild(tr);
});

// ---------- excel export ----------
async function doDownload(filename, dataBlob){
  const downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
  if(downloads){
    try{
      await downloads.save({filename, data: dataBlob});
      setStatus('บันทึกไฟล์ '+filename+' เรียบร้อย', true);
      return;
    }catch(err){
      setStatus('บันทึกไฟล์ไม่สำเร็จ: '+(err&&err.message?err.message:err), false);
      return;
    }
  }
  // fallback (e.g. preview outside published capability context)
  const url = URL.createObjectURL(dataBlob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

document.getElementById('exportXlsxBtn').addEventListener('click', async function(){
  if(!groups.length){ setStatus('ยังไม่มีข้อมูลรายงาน', false); return; }

  // read current (possibly manually edited) table values back from the DOM
  const table = document.querySelector('#reportEl table.rt');
  const trs = Array.from(table.querySelectorAll('tbody tr'));

  // Sheet 1: Result (as printed report)
  const resultAOA = [];
  resultAOA.push(['No.','Lab No.','Sample', ...PARAMS.map(p=>p.label+' '+p.unit), 'Remark']);
  trs.forEach(tr=>{
    const cells = Array.from(tr.children).map(td=>td.textContent.trim());
    resultAOA.push(cells);
  });

  // Sheet 2: Interface (flattened, QC/reference rows excluded, uses averaged/final value per Lab No)
  const interfaceAOA = [['Lab No.','Seq','Target','Result1','Result2','Result']];
  groups.forEach(g=>{
    if(g.isQC) return;
    const labNo = g.labNo;
    const base = labNo.length>3 ? labNo.slice(0,-3) : labNo;
    const seq = labNo.length>3 ? labNo.slice(-3) : '';
    PARAMS.forEach(p=>{
      const v = g._final ? g._final[p.code] : null;
      if(v===null || v===undefined) return;
      const rounded = Math.round(v*10000)/10000; // raw value, floating-point-safe
      interfaceAOA.push([base, seq, p.label, formatValue(p.code, v, g.sampleName, g.isQC), '', rounded]);
    });
  });

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(resultAOA);
  const ws2 = XLSX.utils.aoa_to_sheet(interfaceAOA);
  XLSX.utils.book_append_sheet(wb, ws2, 'Interface'); // Interface first (leftmost tab)
  XLSX.utils.book_append_sheet(wb, ws1, 'Result');
  wb.Workbook = { Views: [{ RTL: false }] };
  if(wb.Workbook) wb.Workbook.ActiveSheet = 0;

  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/octet-stream'});
  const testDate = document.getElementById('testDate').value || 'export';
  await doDownload(`NIR_Interface_${testDate}.xlsx`, blob);
});

// default test date = today

  const d = new Date();
  const iso = d.toISOString().slice(0,10);
  document.getElementById('testDate').value = iso;
})();
